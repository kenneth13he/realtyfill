# .github/dependabot.yml
# Both ecosystems, because the audit that prompted this found the Node tree
# clean and the Python tree never checked at all.
#
# One pip entry, not two. There are two requirements files — requirements.txt
# (the Docker/Render path) and pdf-service/requirements.txt (the Vercel
# service) — and the original config listed a directory for each, on the
# assumption that Dependabot scans each directory independently.
#
# It doesn't, for pip: the "/" scan walks down and finds both files. The proof
# is PRs #8 and #9, opened the same day against the same file with the same
# diff — one from each entry. So "/" alone covers both; a "/pdf-service" entry
# only duplicates it.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Security fixes always open a PR regardless of this grouping; grouping
    # only keeps routine version bumps from becoming a stream of PRs.
    groups:
      all-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
