# .github/dependabot.yml
# Both ecosystems, because the audit that prompted this found the Node tree
# clean and the Python tree never checked at all.
#
# One pip entry, not two. There used to be a second for "/" covering the root
# requirements.txt (the unused Docker/Render path). The root scan also reached
# into pdf-service/, so every Python advisory opened two byte-identical PRs —
# #8 and #9 were the same fastapi bump twice. The root file holds only pypdf
# and is covered by the subdirectory scan anyway.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Security fixes always open a PR regardless of this grouping; grouping
    # only keeps routine version bumps from becoming a stream of PRs.
    groups:
      all-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/pdf-service"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
