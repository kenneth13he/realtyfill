# .github/workflows/docker.yml
# Build-tests the Render/Docker fallback.
#
# ISSUES.md #12: the repo carries both a Vercel path (live) and a
# Render/Docker path (unused), and the Dockerfile's node:24-slim base had
# never been built even once. That left it as neither a real fallback nor
# dead weight. This makes it a real one: if the image stops building, a red
# check says so instead of the discovery happening during an outage, which is
# the only time anyone would reach for it.
#
# Path-filtered on purpose. A Node+Python image takes minutes to build, and
# nothing about a change to app/ can break it — only these files can.

name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "pdf-service/requirements.txt"
      - "package-lock.json"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "pdf-service/requirements.txt"
      - "package-lock.json"
      - ".github/workflows/docker.yml"
  # The base image picks up security patches under the same digest pin only
  # when the digest is bumped — a monthly build surfaces a base that has
  # drifted or a digest that has been pulled.
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: realtyfill:ci
          # Same placeholder reasoning as ci.yml's build step: Next inlines
          # NEXT_PUBLIC_* at build time and lib/env.ts throws on a missing
          # one, so these need to be present, not real.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
            NEXT_PUBLIC_SITE_URL=https://example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Both runtimes are actually present
        # The whole reason this image exists is that lib/pdfFill.ts shells out
        # to Python. An image with Node but no pypdf would build fine and fail
        # at the first generate.
        run: |
          docker run --rm realtyfill:ci node --version
          docker run --rm realtyfill:ci python3 --version
          docker run --rm realtyfill:ci python3 -c "import pypdf; print('pypdf', pypdf.__version__)"
